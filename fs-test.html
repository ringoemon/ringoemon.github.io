<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>test</title>
<style>
  body { margin: 0; padding: 24px 16px; background: #fff8e7; color: #2b2118;
         font: 17px/1.6 -apple-system, sans-serif; }
  button { display: block; width: 100%; margin: 14px 0; padding: 16px; border-radius: 12px;
           background: #ffcf33; color: #2b2118; font: inherit; font-weight: 700;
           border: 2px solid #2b2118; text-align: left; }
  #log { margin-top: 20px; padding: 12px; background: #fff; border-radius: 8px;
         font-size: 14px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<button id="a">A. 全画面にする（標準の書き方）</button>
<button id="b">B. 全画面にする（Safari 用の古い書き方）</button>
<div id="log"></div>
<script>
  var log = document.getElementById("log");
  function say(s) { log.textContent += s + "\n"; }
  var el = document.documentElement;
  say("fullscreenEnabled: " + document.fullscreenEnabled);
  say("webkitFullscreenEnabled: " + document.webkitFullscreenEnabled);
  say("requestFullscreen: " + (typeof el.requestFullscreen));
  say("webkitRequestFullscreen: " + (typeof el.webkitRequestFullscreen));
  say("画面の高さ: " + window.innerHeight + " / " + screen.height);
  document.addEventListener("fullscreenchange", function () { say("→ 全画面になった: " + !!document.fullscreenElement); });
  document.addEventListener("webkitfullscreenchange", function () { say("→ (webkit) 全画面になった: " + !!document.webkitFullscreenElement); });
  document.getElementById("a").onclick = function () {
    if (typeof el.requestFullscreen !== "function") { say("A: この書き方は無い"); return; }
    try {
      var p = el.requestFullscreen();
      if (p && p.then) p.then(function () { say("A: 成功"); }, function (e) { say("A: 失敗 " + e.name + " " + e.message); });
    } catch (e) { say("A: 失敗 " + e.name + " " + e.message); }
  };
  document.getElementById("b").onclick = function () {
    if (typeof el.webkitRequestFullscreen !== "function") { say("B: この書き方は無い"); return; }
    try { el.webkitRequestFullscreen(); say("B: 呼んだ（変化は上の → の行で分かる）"); }
    catch (e) { say("B: 失敗 " + e.name + " " + e.message); }
  };
</script>
</body>
</html>
