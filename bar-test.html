<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>test</title>
<style>
  html, body { margin: 0; background: #fff8e7; color: #2b2118; font: 16px/1.5 -apple-system, sans-serif; }
  /* page is taller than the screen so Safari has something to scroll */
  #runway { height: 300px; background: repeating-linear-gradient(45deg, #f3e3b5 0 12px, #fff8e7 12px 24px); }
  #app { position: sticky; top: 0; height: 100lvh; background: #cfe3c8;
         display: flex; flex-direction: column; justify-content: center; padding: 16px; box-sizing: border-box; }
  #tail { height: 300px; }
  button { margin: 8px 0; padding: 14px; border-radius: 12px; border: 2px solid #2b2118;
           background: #ffcf33; font: inherit; font-weight: 700; }
  #log { margin-top: 12px; padding: 10px; background: #fff; border-radius: 8px; font-size: 13px;
         white-space: pre-wrap; max-height: 40vh; overflow: auto; }
</style>
</head>
<body>
<div id="runway"></div>
<div id="app">
  <div>緑の部分が「地図」のつもりです。下の Safari のバーが小さくなるかを見てください。</div>
  <button id="go">押してスクロールさせる</button>
  <div id="log"></div>
</div>
<div id="tail"></div>
<script>
  var log = document.getElementById("log");
  function say(s) { log.textContent += s + "\n"; }
  function h() { return "見える高さ " + window.innerHeight + " / スクロール " + Math.round(window.scrollY); }
  say("開いた直後: " + h());
  window.addEventListener("resize", function () { say("変化: " + h()); });
  window.addEventListener("load", function () {
    setTimeout(function () { window.scrollTo(0, 300); say("自動でスクロールした後: " + h()); }, 300);
    setTimeout(function () { say("1秒後: " + h()); }, 1300);
  });
  document.getElementById("go").onclick = function () {
    window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
    setTimeout(function () { say("押した後: " + h()); }, 800);
  };
</script>
</body>
</html>
